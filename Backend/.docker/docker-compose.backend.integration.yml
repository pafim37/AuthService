name: auth-service-integration-tests
services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      # TODO: Move this password to a secret store and reference it here instead of hardcoding it.
      MSSQL_SA_PASSWORD: "AuthService123!Pass" 
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ../src
      dockerfile: ../.docker/auth-server.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:5124"
      # TODO: Move this connection string to a secret store and reference it here instead of hardcoding it.
      ConnectionStrings__Default: "Server=database,1433;Database=AuthServiceDatabase;User Id=sa;Password=AuthService123!Pass;TrustServerCertificate=True;Encrypt=True;"
      Jwt__Issuer: "AuthServerService"
      Jwt__Audience: "AdministratorPanel"
      Jwt__AuthServiceKey: "DevelopmentOnlyAuthServiceKeyThatShouldBeReplacedWithASecretValue12345"
    ports:
      - "5124:5124"
    depends_on:
      database:
        condition: service_healthy
