<header class="app-header">
  <div class="brand">
    <h1>Auth Service</h1>
    <span>Administrator Panel</span>
  </div>

  @if (currentUser(); as user) {
    <button matIconButton type="button" [matMenuTriggerFor]="userMenu" aria-label="Open user menu">
      <mat-icon>menu</mat-icon>
    </button>

    <mat-menu #userMenu="matMenu" xPosition="before" class="user-menu">
      <div class="menu-title" mat-menu-item disabled>{{ user }}</div>

      <mat-divider></mat-divider>

      <div class="theme-menu-item" mat-menu-item disableRipple (click)="$event.stopPropagation()">
        <mat-slide-toggle
          [checked]="isDarkTheme()"
          aria-label="Toggle dark mode"
          (change)="toggleTheme($event)"
        >
          {{ isDarkTheme() ? 'Dark' : 'Light' }}
        </mat-slide-toggle>
      </div>

      <mat-divider></mat-divider>

      <button mat-menu-item type="button" (click)="changePassword()">
        <mat-icon>lock_reset</mat-icon>
        <span>Change password</span>
      </button>
      <button mat-menu-item type="button" (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Logout</span>
      </button>
    </mat-menu>
  } @else {
    <div class="header-actions">
      <mat-slide-toggle
        [checked]="isDarkTheme()"
        aria-label="Toggle dark mode"
        (change)="toggleTheme($event)"
      >
        {{ isDarkTheme() ? 'Dark' : 'Light' }}
      </mat-slide-toggle>
    </div>
  }
</header>
